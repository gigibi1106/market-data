name: Fetch Market Data

on:
  schedule:
    # ⚠️ GitHub 免費版排程實際會延遲 1~3.5 小時，所以刻意排在遠早於 08:40 播報之前。
    # 05:10 台灣時間 = 21:10 UTC（前一天），週日~週五 UTC = 台灣週一~週六
    - cron: '10 21 * * 0-5'
    # 07:10 台灣時間的補跑，若第一次被延遲或失敗，這次會覆蓋成更新的資料
    - cron: '10 23 * * 0-5'
  workflow_dispatch:  # 允許手動觸發測試

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch market data
        run: python fetch_market.py

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add market-data.json
          git diff --staged --quiet || git commit -m "market data $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          git push
